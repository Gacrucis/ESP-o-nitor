; Plantilla de configuracion local de PlatformIO.
;
; Copia este archivo a platformio_override.ini (misma carpeta, ignorado por git).
; PlatformIO lo aplica automaticamente por encima de platformio.ini.
;
; Sirve para la clave OTA (--auth), que debe coincidir con SECRET_OTA_PASSWORD del firmware.

[env:esp32dev_ota]
upload_flags =
    --auth=TU_CLAVE_OTA
