services:
  monitor-service:
    build: .
    # Always restart unless stopped manually.
    restart: unless-stopped
    # Log rotation to avoid unbounded growth.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8765:8765"
    environment:
      CLAUDE_HOME: /host/claude
      CODEX_HOME: /host/codex
      CONFIG_PATH: /app/data/config.json
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8765"
      # Minimum interval between regenerations of the cache the ESP32 consumes.
      FRAME_CACHE_TTL_SECONDS: "5"
      # Minimum interval between real queries to the Claude usage endpoint.
      CLAUDE_USAGE_TTL_SECONDS: "300"
      # Minimum interval between local reads of Codex rate_limits.
      CODEX_USAGE_TTL_SECONDS: "30"
    volumes:
      # Host timezone (for the local reset time).
      - /etc/localtime:/etc/localtime:ro
      # Code mounted for hot reloading: editing on the host restarts the service.
      - ./src:/app/src
      - ${HOME}/.claude:/host/claude:ro
      - ${HOME}/.codex:/host/codex:ro
      - monitor-service-data:/app/data

volumes:
  monitor-service-data:
