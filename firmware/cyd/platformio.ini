; Configuracion PlatformIO para el CYD (Cheap Yellow Display, ESP32-2432S028R).
;
; Pantalla ILI9341 320x240 SPI a color + tactil resistiva XPT2046 (no usada aqui).
; La configuracion de TFT_eSPI se inyecta por build_flags para no tener que editar
; el User_Setup.h de la libreria (asi el pinout del CYD queda versionado en el repo).

[env:cyd]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; El CYD trae un CH340; 921600 suele funcionar. Bajar a 460800/115200 si falla la carga.
upload_speed = 921600
; Sistema de archivos interno = LittleFS. Esquema min_spiffs: slots de app de ~1.9MB
; (mantiene OTA A/B) y una particion de datos chica (~190KB) para LittleFS, que casi no
; usamos porque los logs van a la SD. Asi se recupera muchisima holgura de flash.
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    ; Sin logs de debug del core (ahorra flash; usamos nuestra propia consola/logs).
    -D CORE_DEBUG_LEVEL=0
    ; --- TFT_eSPI: pinout y driver del ESP32-2432S028R ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; --- Fuentes GLCD embebidas usadas por el firmware ---
    ; Fuentes nativas de TFT_eSPI: NO se cargan porque todo el texto se dibuja con la
    ; fuente de pixeles 3x5 propia. Asi se ahorra flash (tablas de glifos no usadas).
    ; --- Velocidades SPI del panel del CYD ---
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = cyd.local
; La contrasena OTA (--auth) va en platformio_override.ini (ignorado por git).
; Copiar platformio_override.example.ini a platformio_override.ini y poner la clave alli.
