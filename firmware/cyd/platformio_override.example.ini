; Plantilla de configuracion local de PlatformIO.
;
; Copiar este archivo a platformio_override.ini (misma carpeta, ignorado por git).
; PlatformIO lo aplica automaticamente encima de platformio.ini.
;
; Se usa para la contrasena OTA (--auth), que debe coincidir con SECRET_OTA_PASSWORD
; del firmware en ejecucion.

[env:cyd_ota]
upload_flags =
    --auth=YOUR_OTA_PASSWORD
