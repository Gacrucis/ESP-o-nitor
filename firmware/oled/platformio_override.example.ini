; Local PlatformIO configuration template.
;
; Copy this file to platformio_override.ini (same folder, ignored by git).
; PlatformIO applies it automatically on top of platformio.ini.
;
; Used for the OTA password (--auth), which must match SECRET_OTA_PASSWORD in the firmware.

[env:esp32dev_ota]
upload_flags =
    --auth=YOUR_OTA_PASSWORD
